plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tencent.mps.srplayer'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.tencent.mps.srplayer"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode libs.versions.versionCode.get().toInteger()
        versionName libs.versions.versionName.get()

        // TsrSdk 鉴权所需的 AppId / AuthId，可在根工程 gradle.ext 中注入
        buildConfigField "long", "APP_ID", (gradle.ext.has('App_Id') && gradle.ext.App_Id != null) ? gradle.ext.App_Id.toString() : "0"
        buildConfigField "int", "AUTH_ID", (gradle.ext.has('Auth_Id') && gradle.ext.Auth_Id != null) ? gradle.ext.Auth_Id.toString() : "0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // 按照 AGP 9 的要求处理：从 Manifest 中移除显式 android:extractNativeLibs="true"，并在 app 的构建脚本中改用 jniLibs
    packagingOptions {
        jniLibs {
            useLegacyPackaging true

            // ───── 移除 qnn-runtime 里无使用的 so，减少 APK 体积 ─────
            excludes += [
                '**/libQnnGpu.so',
                '**/libQnnDsp.so',
                '**/libQnnDspV66Stub.so',
                '**/libQnnDspV66Skel.so',
            ]
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "com.tencent.tcr:tsrsdk:1.2.0"

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference:1.2.1'
}
pluginManagement {
    repositories {
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }
    versionCatalogs {
        libs {
            version('versionName', '2.0.0')
            version('versionCode', '2')
            version('compileSdk', '35')
            version('minSdk', '26')
            version('targetSdk', '35')
        }
    }
}

rootProject.name = "TsrDemo"
include ':app'

////////////////// 解析 local.properties，读取 TSR SDK 鉴权所需的 App_Id / Auth_Id //////////////////
def readLocalProperties = { propFile, key ->
    def result = null
    File localPropsFile = file(propFile)
    if (localPropsFile.exists()) {
        Properties properties = new Properties()
        properties.load(new FileInputStream(localPropsFile))
        result = properties.getProperty(key)
    } else {
        println "#readLocalProperties file not exist:" + localPropsFile.absolutePath
    }
    return result
}
// 挂到 gradle.ext，供 app/build.gradle 注入到 BuildConfig.APP_ID / BuildConfig.AUTH_ID
gradle.ext.App_Id = readLocalProperties('local.properties', 'App_Id')?.toLong()
gradle.ext.Auth_Id = readLocalProperties('local.properties', 'Auth_Id')?.toInteger()
